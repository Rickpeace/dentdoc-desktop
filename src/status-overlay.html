<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>DentDoc Status</title>
  <link rel="stylesheet" href="styles/design-system.css">
  <style>
    html, body {
      background: transparent;
      overflow: hidden;
      padding: 0;
      margin: 0;
      min-height: auto;
      min-width: auto;
      height: auto !important;
      width: auto !important;
      display: block;
    }

    body {
      padding: 2px;
    }

    body::before {
      display: none;
    }

    .container {
      background: var(--overlay-bg, rgba(10, 10, 11, 0.95));
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: var(--radius-xl);
      padding: var(--space-5) var(--space-6);
      border: 1px solid var(--overlay-border, rgba(255, 255, 255, 0.1));
      position: relative;
      box-shadow: none;
      width: 400px;
      overflow: hidden;  /* Clip glow effects within rounded corners */
    }

    [data-theme="light"] .container {
      --overlay-bg: rgba(255, 255, 255, 0.95);
      --overlay-border: rgba(0, 0, 0, 0.1);
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
    }

    .header {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      position: relative;
      z-index: 1;
    }

    /* Drag handle for moving the window - covers entire container but stays behind interactive elements */
    .drag-handle {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      cursor: move;
      -webkit-app-region: drag;
      z-index: 0;
    }

    .icon {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      position: relative;
      transition: transform 0.1s ease-out;
    }

    .icon.recording {
      background: linear-gradient(135deg, var(--error-500), #dc2626);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
      cursor: pointer;
      -webkit-app-region: no-drag;
      /* Animation disabled - controlled by JS audio level */
    }

    /* CSS variable for dynamic glow intensity - set by JS */
    .icon.recording.audio-active {
      /* Glow and background controlled by CSS custom properties */
    }

    /* Waveform canvas inside icon */
    .wave-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .icon.recording .wave-canvas {
      opacity: 1;
    }

    /* Hide emoji when recording (waveform takes over) */
    .icon.recording #iconEmoji {
      opacity: 0;
    }

    /* Starting state - greyed out version of recording */
    .icon.starting {
      background: linear-gradient(135deg, #6b7280, #4b5563);
      box-shadow: none;
      animation: processingPulse 1.5s ease-in-out infinite;
    }

    /* Paused state - blue, clickable to resume */
    .icon.paused {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.35);
      cursor: pointer;
      -webkit-app-region: no-drag;
    }

    /* Show emoji (pause symbol) when paused */
    .icon.paused #iconEmoji {
      opacity: 1;
    }

    .icon.processing {
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      box-shadow: none;
      animation: processingPulse 1.5s ease-in-out infinite;
    }

    @keyframes processingPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .icon.success {
      background: linear-gradient(135deg, var(--success-500), var(--success-600));
      box-shadow: none;
    }

    .icon.error {
      background: transparent;
      box-shadow: none;
    }

    .icon.error .error-x {
      font-size: 36px;
      font-weight: 700;
      color: var(--error-500);
      text-shadow: 0 0 12px rgba(239, 68, 68, 0.6), 0 0 24px rgba(239, 68, 68, 0.4);
    }

    /* Error state - red border on container (no shadow to avoid bleed) */
    .container.error-state {
      border: 2px solid var(--error-500);
    }

    .icon.waiting-iphone {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: none;
      animation: processingPulse 1.5s ease-in-out infinite;
    }

    .content {
      flex: 1;
      min-width: 0;
    }

    /* Audio Level Bar CSS removed - only icon animation is used */

    .title {
      color: var(--text-primary);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .message {
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    .settings-link {
      display: block;
      margin-top: 8px;
      color: var(--accent);
      text-decoration: underline;
      font-size: 0.8125rem;
      cursor: pointer;
      transition: opacity 0.15s ease;
      -webkit-app-region: no-drag;
    }

    .settings-link:hover {
      opacity: 0.8;
    }

    .timer {
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
      margin-left: var(--space-2);
      font-size: 0.8125rem;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-tertiary);
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      -webkit-app-region: no-drag;
      transition: all var(--transition-fast);
      flex-shrink: 0;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
    }

    /* Progress Bar */
    .progress-container {
      display: none;
      margin-top: var(--space-5);
      position: relative;
      z-index: 1;
    }

    .progress-container.visible {
      display: block;
    }

    .progress-bar {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-500), var(--primary-400));
      border-radius: var(--radius-full);
      transition: width 0.5s ease-out;
      width: 0%;
      position: relative;
      overflow: hidden;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: shimmer 1.5s infinite;
    }

    .progress-fill.complete {
      background: linear-gradient(90deg, var(--success-500), var(--success-600));
    }

    .progress-fill.complete::after {
      animation: none;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-steps {
      display: flex;
      justify-content: space-between;
      margin-top: var(--space-3);
      font-size: 0.6875rem;
      color: var(--text-muted);
    }

    .progress-step {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      transition: color var(--transition-fast);
    }

    .progress-step.active {
      color: var(--primary-500);
    }

    .progress-step.done {
      color: var(--success-500);
    }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.2);
      transition: all var(--transition-fast);
    }

    .progress-step.active .step-dot {
      background: var(--primary-500);
      box-shadow: none;
      animation: dotPulse 1s ease-in-out infinite;
    }

    .progress-step.done .step-dot {
      background: var(--success-500);
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    /* Actions */
    .actions {
      display: none;
      flex-direction: column;
      margin-top: var(--space-5);
      gap: var(--space-3);
      position: relative;
      z-index: 10;
      /* max-height entfernt - Auto-Resize passt Window an Content an */
      -webkit-app-region: no-drag;
    }

    .actions.visible {
      display: flex;
    }

    /* Scrollbar styling for actions */
    .actions::-webkit-scrollbar {
      width: 5px;
    }

    .actions::-webkit-scrollbar-track {
      background: transparent;
    }

    .actions::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .actions::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    [data-theme="light"] .actions::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.1);
    }

    [data-theme="light"] .actions::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.2);
    }

    .action-btn {
      width: 100%;
      box-sizing: border-box;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      padding: var(--space-4) var(--space-5);
      border-radius: var(--radius-lg);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all var(--transition-normal);
      display: flex;
      align-items: center;
      gap: var(--space-4);
      -webkit-app-region: no-drag;
      text-align: left;
    }

    .action-btn:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-hover);
      transform: translateY(-2px);
      box-shadow: none;
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .action-btn .btn-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .action-btn.summary .btn-icon {
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      box-shadow: none;
    }

    .action-btn.full .btn-icon {
      background: linear-gradient(135deg, var(--info-500), var(--info-600));
      box-shadow: none;
    }

    /* Speaker Optimization Section */
    .optimization-section {
      margin-top: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid var(--glass-border);
    }

    .optimization-section .action-btn.optimize {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
      border-color: rgba(99, 102, 241, 0.3);
    }

    .optimization-section .action-btn.optimize:hover {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2));
      border-color: rgba(99, 102, 241, 0.5);
    }

    .optimization-section .action-btn.optimize .btn-icon {
      background: linear-gradient(135deg, var(--primary-500), #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    [data-theme="light"] .optimization-section .action-btn.optimize {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.08));
      border-color: rgba(99, 102, 241, 0.2);
    }

    [data-theme="light"] .optimization-section .action-btn.optimize:hover {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15));
      border-color: rgba(99, 102, 241, 0.4);
    }

    /* KZV Documentation Section */
    .kzv-section {
      display: none;
      margin-top: var(--space-4);
      padding-top: var(--space-4);
      border-top: 1px solid var(--glass-border);
      position: relative;
      z-index: 1;
    }

    .kzv-section.visible {
      display: block;
    }

    .kzv-label {
      font-size: 0.6875rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-2);
    }

    .kzv-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .kzv-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      -webkit-app-region: no-drag;
    }

    .kzv-btn:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-hover);
      color: var(--text-primary);
    }

    .kzv-btn.copied {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.4);
      color: var(--success-500);
    }

    .kzv-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .kzv-btn .kzv-icon {
      font-size: 0.875rem;
    }

    [data-theme="light"] .kzv-btn {
      background: #ffffff;
      border-color: #e5e7eb;
    }

    [data-theme="light"] .kzv-btn:hover {
      background: #f9fafb;
      border-color: #60a5fa;
    }

    [data-theme="light"] .kzv-btn.copied {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    /* Befund Section (01/PA Status) */
    .befund-section {
      display: none;
      margin-top: var(--space-4);
      padding-top: var(--space-4);
      border-top: 1px solid var(--glass-border);
      position: relative;
      z-index: 1;
    }

    .befund-section.visible {
      display: block;
    }

    .befund-label {
      font-size: 0.6875rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-2);
    }

    .befund-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .befund-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      -webkit-app-region: no-drag;
    }

    .befund-btn:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-hover);
      color: var(--text-primary);
    }

    .befund-btn.copied {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.4);
      color: var(--success-500);
    }

    .befund-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .befund-btn .befund-icon {
      font-size: 0.875rem;
    }

    [data-theme="light"] .befund-btn {
      background: #ffffff;
      border-color: #e5e7eb;
    }

    [data-theme="light"] .befund-btn:hover {
      background: #f9fafb;
      border-color: #60a5fa;
    }

    [data-theme="light"] .befund-btn.copied {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    .action-btn .btn-text {
      flex: 1;
      min-width: 0;
    }

    .action-btn .btn-title {
      font-weight: 600;
      font-size: 0.9375rem;
      margin-bottom: 2px;
    }

    .action-btn .btn-desc {
      font-size: 0.75rem;
      color: var(--text-tertiary);
    }

    .action-btn .btn-status {
      font-size: 20px;
      opacity: 0;
      transition: all var(--transition-fast);
      color: var(--success-500);
    }

    .action-btn.copied .btn-status {
      opacity: 1;
      transform: scale(1.1);
    }

    .action-btn.copied {
      background: rgba(34, 197, 94, 0.1);
      border-color: rgba(34, 197, 94, 0.3);
    }

    /* Light theme overrides */
    [data-theme="light"] .container::before {
      background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.2), transparent);
    }

    [data-theme="light"] .close-btn {
      background: rgba(0, 0, 0, 0.05);
    }

    [data-theme="light"] .close-btn:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    [data-theme="light"] .progress-bar {
      background: #e5e7eb;
    }

    [data-theme="light"] .step-dot {
      background: #d1d5db;
    }

    [data-theme="light"] .action-btn {
      background: #ffffff;
      border-color: #e5e7eb;
    }

    [data-theme="light"] .action-btn:hover {
      background: #f9fafb;
      border-color: #fdba74;
    }

    [data-theme="light"] .action-btn.copied {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    /* iPhone waiting state with QR code */
    .iphone-waiting-section {
      display: none;
      margin-top: var(--space-4);
      padding: var(--space-4);
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: var(--radius-lg);
      text-align: center;
    }

    .iphone-waiting-section.visible {
      display: block;
    }

    .iphone-waiting-section .qr-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
    }

    .iphone-waiting-section .qr-code {
      width: 100px;
      height: 100px;
      background: white;
      border-radius: var(--radius-md);
      padding: 6px;
      flex-shrink: 0;
    }

    .iphone-waiting-section .qr-code canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .iphone-waiting-section .qr-instructions {
      text-align: left;
      flex: 1;
    }

    .iphone-waiting-section .qr-instructions p {
      margin: 0 0 var(--space-2) 0;
      font-size: 0.8125rem;
      color: var(--text-secondary);
    }

    .iphone-waiting-section .qr-instructions .url-hint {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      font-family: var(--font-mono);
      word-break: break-all;
    }

    [data-theme="light"] .iphone-waiting-section {
      background: rgba(59, 130, 246, 0.08);
      border-color: rgba(59, 130, 246, 0.15);
    }
  </style>
</head>
<body>
  <script>
    // Load theme immediately to prevent flash
    const { ipcRenderer: themeRenderer } = require('electron');
    themeRenderer.invoke('get-theme').then(theme => {
      document.documentElement.setAttribute('data-theme', theme || 'dark');
    });
  </script>
  <div class="container">
    <div class="drag-handle"></div>
    <div class="header">
      <div id="icon" class="icon processing">
        <span id="iconEmoji">⚡</span>
        <canvas id="waveCanvas" class="wave-canvas"></canvas>
      </div>
      <div class="content">
        <div id="title" class="title">Verarbeitung...</div>
        <div id="message" class="message">Upload 0%</div>
      </div>
      <button id="closeBtn" class="close-btn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 1l12 12M13 1L1 13"/>
        </svg>
      </button>
    </div>

    <!-- Audio Level Bar removed - only icon animation is used -->

    <!-- iPhone waiting section with QR code -->
    <div id="iphoneWaitingSection" class="iphone-waiting-section">
      <div class="qr-container">
        <div id="iphoneQrCode" class="qr-code"></div>
        <div class="qr-instructions">
          <p><strong>Smartphone ist gekoppelt</strong>, aber die Mikrofon-Seite muss geöffnet sein.</p>
          <p>QR-Code scannen oder öffnen:</p>
          <p class="url-hint" id="iphoneMicUrlHint">dentdoc.de/mic</p>
        </div>
      </div>
    </div>

    <div id="progressContainer" class="progress-container">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div class="progress-steps">
        <div id="step0" class="progress-step">
          <span class="step-dot"></span>
          <span>Analyse</span>
        </div>
        <div id="step1" class="progress-step">
          <span class="step-dot"></span>
          <span>Upload</span>
        </div>
        <div id="step2" class="progress-step">
          <span class="step-dot"></span>
          <span>Transkription</span>
        </div>
        <div id="step3" class="progress-step">
          <span class="step-dot"></span>
          <span>Sprecher</span>
        </div>
        <div id="step4" class="progress-step">
          <span class="step-dot"></span>
          <span>Dokumentation</span>
        </div>
      </div>
    </div>

    <div id="actions" class="actions">
      <button id="copySummaryBtn" class="action-btn summary">
        <div class="btn-icon">📋</div>
        <div class="btn-text">
          <div class="btn-title">Zusammenfassung</div>
          <div class="btn-desc">KI-generierte Dokumentation kopieren</div>
        </div>
        <div class="btn-status">✓</div>
      </button>
      <button id="copyFullBtn" class="action-btn full">
        <div class="btn-icon">📄</div>
        <div class="btn-text">
          <div class="btn-title">Komplette Unterhaltung</div>
          <div class="btn-desc">Transkript + Dokumentation kopieren</div>
        </div>
        <div class="btn-status">✓</div>
      </button>

      <!-- KZV Documentation Section -->
      <div id="kzvSection" class="kzv-section">
        <div class="kzv-label">KZV-Dokumentation</div>
        <div class="kzv-buttons">
          <button id="copyKzvBtn" class="kzv-btn" title="KZV-taugliche Dokumentation kopieren" disabled>
            <span class="kzv-icon">📑</span>
            <span>KZV-Doku kopieren</span>
          </button>
        </div>
      </div>

      <!-- Z-Doku Section (Chef-Zusammenfassung) -->
      <div id="zDokuSection" class="kzv-section">
        <div class="kzv-label">Z-Dokumentation</div>
        <div class="kzv-buttons">
          <button id="copyZDokuBtn" class="kzv-btn" title="Chef-taugliche Z-Dokumentation kopieren" disabled>
            <span class="kzv-icon">📋</span>
            <span>Z-Doku kopieren</span>
          </button>
        </div>
      </div>

      <!-- Normalized Transcript Section -->
      <div id="normalizedSection" class="kzv-section">
        <div class="kzv-label">Normalisiertes Transkript</div>
        <div class="kzv-buttons">
          <button id="copyNormalizedBtn" class="kzv-btn" title="Normalisiertes Transkript kopieren" disabled>
            <span class="kzv-icon">📝</span>
            <span>Transkript kopieren</span>
          </button>
        </div>
      </div>

      <!-- Befund Section (01/PA Status) -->
      <div id="befundSection" class="befund-section">
        <div class="befund-label">Strukturierte Befunde</div>
        <div class="befund-buttons">
          <button id="show01Status" class="befund-btn" title="Zahnstatus visuell anzeigen" disabled>
            <span class="befund-icon">🦷</span>
            <span>Zahnstatus</span>
          </button>
          <button id="copy01Status" class="befund-btn" title="01-Befund als JSON kopieren" disabled>
            <span class="befund-icon">📄</span>
            <span>01 JSON</span>
          </button>
          <button id="copyPAStatus" class="befund-btn" title="PA-Status als JSON kopieren" disabled>
            <span class="befund-icon">📋</span>
            <span>PA JSON</span>
          </button>
        </div>
      </div>

      <!-- Speaker Optimization Section -->
      <div id="optimizationSection" class="optimization-section" style="display: none;">
        <button id="optimizeBtn" class="action-btn optimize">
          <div class="btn-icon">🎯</div>
          <div class="btn-text">
            <div class="btn-title">Sprechererkennung optimieren</div>
            <div class="btn-desc"><span id="unrecognizedCount">0</span> unerkannte Sprecher</div>
          </div>
        </button>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const icon = document.getElementById('icon');
    const iconEmoji = document.getElementById('iconEmoji');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const closeBtn = document.getElementById('closeBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const step0 = document.getElementById('step0');
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    const step4 = document.getElementById('step4');
    const actions = document.getElementById('actions');
    const copySummaryBtn = document.getElementById('copySummaryBtn');
    const copyFullBtn = document.getElementById('copyFullBtn');

    // =============================================
    // BREATHING DOT + RING METER (Modern KI-SaaS)
    // =============================================
    const waveCanvas = document.getElementById('waveCanvas');
    const waveCtx = waveCanvas.getContext('2d');

    const CSS_SIZE = 46;
    const dpr = window.devicePixelRatio || 1;

    waveCanvas.style.width = CSS_SIZE + 'px';
    waveCanvas.style.height = CSS_SIZE + 'px';
    waveCanvas.width = Math.round(CSS_SIZE * dpr);
    waveCanvas.height = Math.round(CSS_SIZE * dpr);
    waveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    let currentAudioLevel = 0;
    let smoothedLevel = 0;
    let waveAnimationId = null;

    const levelAttack = 0.35;
    const levelDecay = 0.90;

    // Hysteresis gate
    let gateOpen = false;
    const OPEN_TH = 0.09;
    const CLOSE_TH = 0.05;
    const ABS_KILL = 0.02;

    // Activity detector - the key to clean UI
    let lastActiveMs = 0;
    const ACTIVE_HOLD_MS = 280;
    const ACTIVE_LEVEL_TH = 0.16;

    // Smooth ring progress
    let ringProgress = 0;
    const ringAttack = 0.15;
    const ringDecay = 0.94;

    function drawIndicator() {
      const ctx = waveCtx;
      const w = CSS_SIZE;
      const h = CSS_SIZE;
      const cx = w / 2;
      const cy = h / 2;

      ctx.clearRect(0, 0, w, h);

      // Smooth (attack/decay)
      if (currentAudioLevel > smoothedLevel) {
        smoothedLevel += (currentAudioLevel - smoothedLevel) * levelAttack;
      } else {
        smoothedLevel *= levelDecay;
      }
      if (smoothedLevel < 0.01) smoothedLevel = 0;

      // Activity detector - the KEY to clean UI
      const now = performance.now();
      const isActive = (now - lastActiveMs) < ACTIVE_HOLD_MS;

      // Visual level for animations
      const visual = isActive ? Math.pow(smoothedLevel, 0.6) : 0;

      // Smooth ring progress
      const targetRing = isActive ? Math.pow(smoothedLevel, 0.6) : 0;
      if (targetRing > ringProgress) {
        ringProgress += (targetRing - ringProgress) * ringAttack;
      } else {
        ringProgress *= ringDecay;
      }
      if (ringProgress < 0.005) ringProgress = 0;

      // ----- STYLE -----
      const baseR = 6.2;
      const scale = 1 + visual * 0.55;
      const dotR = baseR * scale;

      // Subtle glow behind dot (only when active)
      if (isActive && visual > 0) {
        const glowAlpha = 0.08 + visual * 0.22;
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${glowAlpha})`;
        ctx.arc(cx, cy, dotR + 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Filled dot (always visible)
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${isActive ? 0.95 : 0.22})`;
      ctx.arc(cx, cy, isActive ? dotR : baseR, 0, Math.PI * 2);
      ctx.fill();

      // RING METER (only when active)
      if (isActive && ringProgress > 0.01) {
        const ringR = 16;
        const ringW = 2.3;

        // Faint full ring background
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.14)';
        ctx.lineWidth = ringW;
        ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
        ctx.stroke();

        // Progress ring (meter)
        const start = -Math.PI / 2;
        const end = start + Math.PI * 2 * Math.min(1, ringProgress);

        ctx.beginPath();
        ctx.strokeStyle = `rgba(255,255,255,${0.70 + visual * 0.25})`;
        ctx.lineWidth = ringW;
        ctx.lineCap = 'round';
        ctx.arc(cx, cy, ringR, start, end);
        ctx.stroke();

        // Outer glow ring
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255,255,255,${0.10 + visual * 0.15})`;
        ctx.lineWidth = ringW + 5;
        ctx.arc(cx, cy, ringR, start, end);
        ctx.stroke();
      }

      if (currentState === 'recording') {
        waveAnimationId = requestAnimationFrame(drawIndicator);
      }
    }

    function startWaveAnimation() {
      if (waveAnimationId) cancelAnimationFrame(waveAnimationId);
      waveAnimationId = requestAnimationFrame(drawIndicator);
    }

    function stopWaveAnimation() {
      if (waveAnimationId) {
        cancelAnimationFrame(waveAnimationId);
        waveAnimationId = null;
      }
      currentAudioLevel = 0;
      smoothedLevel = 0;
      ringProgress = 0;
      gateOpen = false;
      lastActiveMs = 0;
      // Clear canvas completely
      waveCtx.clearRect(0, 0, CSS_SIZE, CSS_SIZE);
    }

    let currentDocumentation = null;
    let currentKzvDocumentation = null;
    let currentZDocumentation = null;
    let currentTranscript = null;
    let currentReconstructedTranscript = null;
    let currentTranscriptWithSpeakers = null;
    let currentRecognizedSpeakers = [];
    let currentDetection = null;
    let currentStatus01 = null;
    let currentStatusPA = null;
    let currentState = null;
    let timerInterval = null;
    let recordingStartTime = null;
    let totalPausedTime = 0;      // Total ms spent paused
    let pauseStartedAt = null;    // When current pause started
    let lastClickedDoc = null; // Tracks which documentation was last clicked ('summary', 'full')
    let pauseToggleLocked = false; // Prevents double-clicks on pause button

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function startTimer() {
      stopTimer(); // Clear any existing timer
      recordingStartTime = Date.now();
      totalPausedTime = 0;  // Reset paused time on new recording
      pauseStartedAt = null;
      const timerEl = document.getElementById('timer');
      if (timerEl) timerEl.textContent = '0:00';
      timerInterval = setInterval(() => {
        const timerEl = document.getElementById('timer');
        if (timerEl) {
          const elapsed = Math.floor((Date.now() - recordingStartTime - totalPausedTime) / 1000);
          timerEl.textContent = formatTime(elapsed);
        }
      }, 1000);
    }

    function resumeTimer() {
      // Resume from pause - don't reset recordingStartTime
      if (pauseStartedAt) {
        totalPausedTime += (Date.now() - pauseStartedAt);
        pauseStartedAt = null;
      }
      stopTimer(); // Clear any existing interval
      timerInterval = setInterval(() => {
        const timerEl = document.getElementById('timer');
        if (timerEl) {
          const elapsed = Math.floor((Date.now() - recordingStartTime - totalPausedTime) / 1000);
          timerEl.textContent = formatTime(elapsed);
        }
      }, 1000);
    }

    function pauseTimer() {
      pauseStartedAt = Date.now();
      stopTimer();  // Stop the interval but keep the displayed value
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function getCurrentTimerValue() {
      const timerEl = document.getElementById('timer');
      if (timerEl && timerEl.textContent) {
        return timerEl.textContent;
      }
      // Fallback: calculate from start time
      if (recordingStartTime) {
        const elapsed = Math.floor((Date.now() - recordingStartTime - totalPausedTime) / 1000);
        return formatTime(elapsed);
      }
      return '0:00';
    }

    function resetSteps() {
      step0.className = 'progress-step';
      step1.className = 'progress-step';
      step2.className = 'progress-step';
      step3.className = 'progress-step';
      step4.className = 'progress-step';
      progressFill.style.width = '0%';
      progressFill.classList.remove('complete');
    }

    function setProgress(step, percent, isComplete = false) {
      progressFill.style.width = percent + '%';

      if (isComplete) {
        progressFill.classList.add('complete');
        step0.className = 'progress-step done';
        step1.className = 'progress-step done';
        step2.className = 'progress-step done';
        step3.className = 'progress-step done';
        step4.className = 'progress-step done';
      } else {
        progressFill.classList.remove('complete');
        // Reset all steps to grey (not started)
        const allSteps = [step0, step1, step2, step3, step4];
        allSteps.forEach(s => s.className = 'progress-step');
        // Mark steps: done (green) for completed, active (orange) for current
        if (step === 0) {
          step0.className = 'progress-step active';
        } else if (step === 1) {
          step0.className = 'progress-step done';
          step1.className = 'progress-step active';
        } else if (step === 2) {
          step0.className = 'progress-step done';
          step1.className = 'progress-step done';
          step2.className = 'progress-step active';
        } else if (step === 3) {
          step0.className = 'progress-step done';
          step1.className = 'progress-step done';
          step2.className = 'progress-step done';
          step3.className = 'progress-step active';
        } else if (step === 4) {
          step0.className = 'progress-step done';
          step1.className = 'progress-step done';
          step2.className = 'progress-step done';
          step3.className = 'progress-step done';
          step4.className = 'progress-step active';
        }
      }
    }

    // Generate QR code for iPhone mic URL
    async function generateIphoneQrCode(url) {
      const QRCode = require('qrcode');
      const container = document.getElementById('iphoneQrCode');
      container.innerHTML = '';

      try {
        const canvas = document.createElement('canvas');
        await QRCode.toCanvas(canvas, url, {
          width: 88,
          margin: 0,
          color: {
            dark: '#000000',
            light: '#ffffff'
          }
        });
        container.appendChild(canvas);
      } catch (err) {
        console.error('Failed to generate iPhone QR code:', err);
        container.innerHTML = '<span style="font-size: 10px; color: var(--text-tertiary);">QR-Code Fehler</span>';
      }
    }

    function updateAudioLevel(level) {
      const x = Math.max(0, Math.min(1, level));

      // Absolute kill zone (removes mic hiss/DC)
      if (x < ABS_KILL) {
        gateOpen = false;
        currentAudioLevel = 0;
        return;
      }

      // Hysteresis gate
      if (!gateOpen && x > OPEN_TH) gateOpen = true;
      if (gateOpen && x < CLOSE_TH) gateOpen = false;

      if (!gateOpen) {
        currentAudioLevel = 0;
        return;
      }

      // Amplify (speech-friendly)
      const adjusted = (x - CLOSE_TH) / (1 - CLOSE_TH);
      const amplified = Math.pow(adjusted * 3.0, 0.65);
      currentAudioLevel = Math.min(1, amplified);

      // Activity detector: only count "real audio"
      if (currentAudioLevel > ACTIVE_LEVEL_TH) {
        lastActiveMs = performance.now();
      }
    }

    ipcRenderer.on('update-status', (event, data) => {
      title.textContent = data.title;
      const wasRecording = currentState === 'recording';
      const wasPaused = currentState === 'paused';
      currentState = data.type;

      // Reset icon classes, scale, and any dynamic styles from audio level
      icon.className = 'icon ' + data.type;
      icon.style.transform = 'scale(1)';
      icon.style.background = '';  // Reset to CSS default
      icon.style.boxShadow = '';   // Reset to CSS default

      // Reset error-specific styling
      iconEmoji.className = '';
      document.querySelector('.container').classList.remove('error-state');

      // Stop waveform animation when leaving recording state
      if (wasRecording && data.type !== 'recording') {
        stopWaveAnimation();
      }

      // Hide iPhone waiting section by default (will be shown only in waiting-iphone state)
      document.getElementById('iphoneWaitingSection').classList.remove('visible');

      // Set emoji and progress based on type
      switch (data.type) {
        case 'starting':
          // Starting state - greyed out recording indicator
          iconEmoji.textContent = '⏳';
          message.textContent = data.message;
          progressContainer.classList.remove('visible');
          actions.classList.remove('visible');
          resetSteps();
          break;
        case 'recording':
          iconEmoji.textContent = '🔴';  // Hidden by CSS, waveform shows instead
          message.innerHTML = data.message + ' <span id="timer" class="timer"></span>';
          // Check pauseStartedAt because we might come from 'starting' state (paused → starting → recording)
          if (wasPaused || pauseStartedAt) {
            resumeTimer();  // Resume from pause - don't reset timer
          } else {
            startTimer();   // Fresh start
          }
          startWaveAnimation();  // Start waveform animation
          progressContainer.classList.remove('visible');
          actions.classList.remove('visible');
          resetSteps();
          break;
        case 'paused':
          iconEmoji.textContent = '⏸';  // Pause symbol visible
          stopWaveAnimation();           // No waveform during pause
          // Keep timer display but stop counting (preserve current value)
          message.innerHTML = data.message + ' <span id="timer" class="timer">' + getCurrentTimerValue() + '</span>';
          pauseTimer();  // Stop counting but track pause duration
          progressContainer.classList.remove('visible');
          actions.classList.remove('visible');
          break;
        case 'processing':
          stopTimer();
          iconEmoji.textContent = '⚡';
          message.textContent = data.message;
          progressContainer.classList.add('visible');
          actions.classList.remove('visible');
          // Set progress based on step (5 steps: Analyse, Upload, Transkription, Sprecher, Dokumentation)
          // Step 0 (Analyse/VAD): 0-15%, Step 1 (Upload): 15-35%, Step 2: 35-55%, Step 3: 55-75%, Step 4: 75-100%
          if (data.step === 0) {
            // Analyse step: 0-15% based on VAD progressPercent (0-100 from worker)
            const vadPercent = data.progressPercent
              ? Math.round((data.progressPercent / 100) * 15)
              : 0;
            setProgress(0, vadPercent);
          } else if (data.step === 1) {
            // Upload step: 15-35% based on actual upload progress
            const uploadPercent = data.uploadProgress !== undefined
              ? 15 + Math.round(data.uploadProgress * 0.20)  // Scale 0-100% to 15-35%
              : 15;
            setProgress(1, uploadPercent);
          } else if (data.step === 2) {
            setProgress(2, 50);   // Transkription: 35-55%
          } else if (data.step === 3) {
            setProgress(3, 70);   // Sprecher: 55-75%
          } else if (data.step === 4) {
            setProgress(4, 88);   // Dokumentation: 75-100%
          }
          break;
        case 'success':
          stopTimer();
          iconEmoji.textContent = '✅';
          message.textContent = data.message;
          progressContainer.classList.remove('visible');
          if (data.documentation) {
            currentDocumentation = data.documentation;
            currentKzvDocumentation = data.kzvDocumentation || null;
            currentZDocumentation = data.zDocumentation || null;
            currentTranscript = data.transcript;
            currentReconstructedTranscript = data.reconstructedTranscript || null;
            currentTranscriptWithSpeakers = data.transcriptWithSpeakers || null;
            currentRecognizedSpeakers = data.recognizedSpeakers || [];
            currentDetection = data.detection || null;
            currentStatus01 = data.status01 || null;
            currentStatusPA = data.statusPA || null;
            actions.classList.add('visible');
            copySummaryBtn.classList.remove('copied');
            copyFullBtn.classList.remove('copied');

            // Show KZV section if kzvDocumentation available
            const kzvSection = document.getElementById('kzvSection');
            const copyKzvBtn = document.getElementById('copyKzvBtn');
            if (currentKzvDocumentation) {
              kzvSection.classList.add('visible');
              copyKzvBtn.disabled = false;
              copyKzvBtn.classList.remove('copied');
            } else {
              kzvSection.classList.remove('visible');
              copyKzvBtn.disabled = true;
            }

            // Show Z-Doku section if zDocumentation available
            const zDokuSection = document.getElementById('zDokuSection');
            const copyZDokuBtn = document.getElementById('copyZDokuBtn');
            if (currentZDocumentation) {
              zDokuSection.classList.add('visible');
              copyZDokuBtn.disabled = false;
              copyZDokuBtn.classList.remove('copied');
            } else {
              zDokuSection.classList.remove('visible');
              copyZDokuBtn.disabled = true;
            }

            // Show normalized transcript section if available
            const normalizedSection = document.getElementById('normalizedSection');
            const copyNormalizedBtn = document.getElementById('copyNormalizedBtn');
            if (currentReconstructedTranscript) {
              normalizedSection.classList.add('visible');
              copyNormalizedBtn.disabled = false;
              copyNormalizedBtn.classList.remove('copied');
            } else {
              normalizedSection.classList.remove('visible');
              copyNormalizedBtn.disabled = true;
            }

            // Show befund section if 01 or PA status available
            const befundSection = document.getElementById('befundSection');
            const show01Btn = document.getElementById('show01Status');
            const copy01Btn = document.getElementById('copy01Status');
            const copyPABtn = document.getElementById('copyPAStatus');
            if (currentStatus01 || currentStatusPA) {
              befundSection.classList.add('visible');
              // Enable/disable buttons based on available data
              show01Btn.disabled = !currentStatus01;
              copy01Btn.disabled = !currentStatus01;
              copyPABtn.disabled = !currentStatusPA;
              // Reset copied state
              show01Btn.classList.remove('copied');
              copy01Btn.classList.remove('copied');
              copyPABtn.classList.remove('copied');
            } else {
              befundSection.classList.remove('visible');
            }

            // Check for unrecognized speakers and show optimization button
            checkOptimizationAvailable();

            // Auto-copy the last clicked documentation type
            autoCopyLastClicked();
          }
          break;
        case 'waiting-iphone':
          // Waiting for iPhone to connect - show QR code
          iconEmoji.textContent = '📱';
          message.textContent = data.message;
          progressContainer.classList.remove('visible');
          actions.classList.remove('visible');
          // Show iPhone waiting section with QR code
          const iphoneSection = document.getElementById('iphoneWaitingSection');
          iphoneSection.classList.add('visible');
          // Generate QR code for /mic URL
          if (data.micUrl) {
            generateIphoneQrCode(data.micUrl);
            document.getElementById('iphoneMicUrlHint').textContent = data.micUrl.replace('https://', '');
          }
          resetSteps();
          break;
        case 'error':
          stopTimer();
          iconEmoji.textContent = '✕';
          iconEmoji.className = 'error-x';
          // Show error message with settings link
          message.innerHTML = data.message + '<a href="#" class="settings-link">Einstellungen öffnen</a>';
          progressContainer.classList.remove('visible');
          actions.classList.remove('visible');
          // Add red border to container
          document.querySelector('.container').classList.add('error-state');
          // Play Windows error sound
          ipcRenderer.send('play-error-sound');
          // Hide iPhone waiting section
          document.getElementById('iphoneWaitingSection').classList.remove('visible');
          // Add click handler for settings link
          message.querySelector('.settings-link').addEventListener('click', (e) => {
            e.preventDefault();
            ipcRenderer.send('open-microphone-settings');
          });
          break;
      }

      // Size is now controlled entirely by main process in updateStatusOverlay()
    });

    closeBtn.addEventListener('click', () => {
      if (currentState === 'starting' || currentState === 'recording' || currentState === 'waiting-iphone' || currentState === 'paused') {
        // Cancel recording - don't process
        ipcRenderer.send('cancel-recording');
      }
      ipcRenderer.send('close-status-overlay');
    });

    // Icon click handler for pause/resume (with debounce lock)
    icon.addEventListener('click', async () => {
      if (currentState === 'recording' || currentState === 'paused') {
        if (pauseToggleLocked) return;  // Ignore clicks while processing
        pauseToggleLocked = true;
        try {
          await ipcRenderer.invoke('toggle-pause');
        } finally {
          pauseToggleLocked = false;
        }
      }
    });

    copySummaryBtn.addEventListener('click', () => {
      if (currentDocumentation) {
        ipcRenderer.invoke('copy-to-clipboard', currentDocumentation);
        showCopied(copySummaryBtn);
        lastClickedDoc = 'summary';
        saveLastClickedDoc();
      }
    });

    copyFullBtn.addEventListener('click', () => {
      let fullText = '';

      // 1. Zusammenfassung (Dokumentation) - already includes "Erkannte Personen" from backend
      if (currentDocumentation) {
        fullText += '--- Zusammenfassung ---\n\n' + currentDocumentation + '\n\n';
      }

      // 2. KZV-Dokumentation (wenn vorhanden - Agent V2.1)
      if (currentKzvDocumentation) {
        fullText += '--- KZV-Dokumentation ---\n\n' + currentKzvDocumentation + '\n\n';
      }

      // 2b. Z-Dokumentation (wenn vorhanden - Agent V2.1)
      if (currentZDocumentation) {
        fullText += '--- Z-Dokumentation ---\n\n' + currentZDocumentation + '\n\n';
      }

      // 3. Normalisiertes Transkript (wenn vorhanden - Agent V2)
      if (currentReconstructedTranscript) {
        fullText += '--- Normalisiertes Transkript ---\n\n' + currentReconstructedTranscript + '\n\n';
      }

      // 4. Transkript mit Sprechern
      if (currentTranscriptWithSpeakers) {
        fullText += '--- Transkript mit Sprechern ---\n\n' + currentTranscriptWithSpeakers;
      } else if (currentTranscript) {
        // Fallback: Roh-Transkript wenn kein Speaker-Transkript verfügbar
        fullText += '--- Transkript ---\n\n' + currentTranscript;
      }

      if (fullText) {
        ipcRenderer.invoke('copy-to-clipboard', fullText.trim());
        showCopied(copyFullBtn);
        lastClickedDoc = 'full';
        saveLastClickedDoc();
      }
    });

    // Befund buttons (01-Status / PA-Status)
    // Show tooth chart button - opens visual chart in dashboard
    document.getElementById('show01Status').addEventListener('click', () => {
      if (currentStatus01) {
        ipcRenderer.send('open-tooth-chart', { status01: currentStatus01 });
        showCopied(document.getElementById('show01Status'));
      }
    });

    // Copy 01 JSON button
    document.getElementById('copy01Status').addEventListener('click', () => {
      if (currentStatus01) {
        const jsonStr = JSON.stringify(currentStatus01, null, 2);
        ipcRenderer.invoke('copy-to-clipboard', jsonStr);
        showCopied(document.getElementById('copy01Status'));
      }
    });

    // Copy PA JSON button
    document.getElementById('copyPAStatus').addEventListener('click', () => {
      if (currentStatusPA) {
        const jsonStr = JSON.stringify(currentStatusPA, null, 2);
        ipcRenderer.invoke('copy-to-clipboard', jsonStr);
        showCopied(document.getElementById('copyPAStatus'));
      }
    });

    // Copy KZV Documentation button
    document.getElementById('copyKzvBtn').addEventListener('click', () => {
      if (currentKzvDocumentation) {
        ipcRenderer.invoke('copy-to-clipboard', currentKzvDocumentation);
        showCopied(document.getElementById('copyKzvBtn'));
        lastClickedDoc = 'kzv';
        saveLastClickedDoc();
      }
    });

    // Copy Z-Doku button
    document.getElementById('copyZDokuBtn').addEventListener('click', () => {
      if (currentZDocumentation) {
        ipcRenderer.invoke('copy-to-clipboard', currentZDocumentation);
        showCopied(document.getElementById('copyZDokuBtn'));
        lastClickedDoc = 'zdoku';
        saveLastClickedDoc();
      }
    });

    // Copy Normalized Transcript button
    document.getElementById('copyNormalizedBtn').addEventListener('click', () => {
      if (currentReconstructedTranscript) {
        ipcRenderer.invoke('copy-to-clipboard', currentReconstructedTranscript);
        showCopied(document.getElementById('copyNormalizedBtn'));
        lastClickedDoc = 'normalized';
        saveLastClickedDoc();
      }
    });

    function showCopied(btn) {
      btn.classList.add('copied');
      setTimeout(() => {
        btn.classList.remove('copied');
      }, 2000);
    }

    // Log to main process (visible in terminal)
    function log(...args) {
      console.log(...args);
      ipcRenderer.send('log-from-renderer', '[AutoCopy]', ...args);
    }

    // Save last clicked doc preference to main process
    function saveLastClickedDoc() {
      log('Saving preference:', lastClickedDoc);
      ipcRenderer.invoke('set-last-clicked-doc', lastClickedDoc);
    }

    // Load last clicked doc preference from main process
    async function loadLastClickedDoc() {
      const saved = await ipcRenderer.invoke('get-last-clicked-doc');
      log('Loaded preference:', saved);
      if (saved) {
        lastClickedDoc = saved;
      }
    }

    // Auto-copy the last clicked documentation type
    function autoCopyLastClicked() {
      log('Attempting auto-copy, lastClickedDoc:', lastClickedDoc);
      if (!lastClickedDoc) {
        log('No preference set, skipping auto-copy');
        return;
      }

      let textToCopy = null;
      let btnToHighlight = null;

      switch (lastClickedDoc) {
        case 'summary':
          textToCopy = currentDocumentation;
          btnToHighlight = copySummaryBtn;
          break;
        case 'full':
          // Build full text same as copyFullBtn click handler
          let fullText = '';
          // 1. Zusammenfassung - already includes "Erkannte Personen" from backend
          if (currentDocumentation) fullText += '--- Zusammenfassung ---\n\n' + currentDocumentation + '\n\n';
          // 2. KZV-Dokumentation (wenn vorhanden - Agent V2.1)
          if (currentKzvDocumentation) fullText += '--- KZV-Dokumentation ---\n\n' + currentKzvDocumentation + '\n\n';
          // 2b. Z-Dokumentation (wenn vorhanden - Agent V2.1)
          if (currentZDocumentation) fullText += '--- Z-Dokumentation ---\n\n' + currentZDocumentation + '\n\n';
          // 3. Normalisiertes Transkript (wenn vorhanden - Agent V2)
          if (currentReconstructedTranscript) fullText += '--- Normalisiertes Transkript ---\n\n' + currentReconstructedTranscript + '\n\n';
          // 4. Transkript mit Sprechern
          if (currentTranscriptWithSpeakers) {
            fullText += '--- Transkript mit Sprechern ---\n\n' + currentTranscriptWithSpeakers;
          } else if (currentTranscript) {
            fullText += '--- Transkript ---\n\n' + currentTranscript;
          }
          textToCopy = fullText.trim();
          btnToHighlight = copyFullBtn;
          break;
        case 'kzv':
          textToCopy = currentKzvDocumentation;
          btnToHighlight = document.getElementById('copyKzvBtn');
          break;
        case 'zdoku':
          textToCopy = currentZDocumentation;
          btnToHighlight = document.getElementById('copyZDokuBtn');
          break;
        case 'normalized':
          textToCopy = currentReconstructedTranscript;
          btnToHighlight = document.getElementById('copyNormalizedBtn');
          break;
      }

      if (textToCopy && btnToHighlight) {
        log('Auto-copying:', lastClickedDoc, '- Text length:', textToCopy.length);
        ipcRenderer.invoke('copy-to-clipboard', textToCopy);
        showCopied(btnToHighlight);
      } else {
        log('Could not auto-copy - textToCopy:', !!textToCopy, 'btnToHighlight:', !!btnToHighlight);
      }
    }

    // Load preference on startup
    loadLastClickedDoc();

    // Listen for audio level updates (from local mic or iPhone)
    ipcRenderer.on('audio-level', (event, level) => {
      updateAudioLevel(level);
    });

    // Listen for iPhone audio level updates (same behavior, different source)
    ipcRenderer.on('iphone-audio-level', (event, level) => {
      updateAudioLevel(level);
    });

    // Speaker Optimization
    const optimizationSection = document.getElementById('optimizationSection');
    const optimizeBtn = document.getElementById('optimizeBtn');
    const unrecognizedCountEl = document.getElementById('unrecognizedCount');

    async function checkOptimizationAvailable() {
      try {
        const result = await ipcRenderer.invoke('get-pending-optimization-data');
        if (result.available && result.unrecognizedCount > 0) {
          unrecognizedCountEl.textContent = result.unrecognizedCount;
          optimizationSection.style.display = 'block';
        } else {
          optimizationSection.style.display = 'none';
        }
      } catch (e) {
        console.error('Error checking optimization availability:', e);
        optimizationSection.style.display = 'none';
      }
    }

    optimizeBtn.addEventListener('click', async () => {
      try {
        // Initialize the optimization session
        const result = await ipcRenderer.invoke('init-optimization-from-pending');
        if (result.success) {
          // Open the dashboard with optimization modal
          ipcRenderer.send('open-speaker-optimization-modal');
        } else {
          console.error('Failed to init optimization:', result.error);
        }
      } catch (e) {
        console.error('Error starting optimization:', e);
      }
    });

    // =============================================
    // AUTO-RESIZE: Window passt sich Content an
    // =============================================
    const containerEl = document.querySelector('.container');
    let lastSentWidth = 0;
    let lastSentHeight = 0;
    let resizeThrottleTimeout = null;

    function sendSizeToMain() {
      if (!containerEl) return;

      const rect = containerEl.getBoundingClientRect();
      // Add small padding for shadow/border safety
      const width = Math.ceil(rect.width) + 4;
      const height = Math.ceil(rect.height) + 4;

      // Only send if size actually changed (avoid spam)
      if (width === lastSentWidth && height === lastSentHeight) return;

      lastSentWidth = width;
      lastSentHeight = height;

      ipcRenderer.send('overlay:resize', { width, height });
    }

    // Throttled version to avoid excessive IPC calls
    function sendSizeThrottled() {
      if (resizeThrottleTimeout) return;
      resizeThrottleTimeout = setTimeout(() => {
        resizeThrottleTimeout = null;
        sendSizeToMain();
      }, 50);
    }

    // Initial size after load
    window.addEventListener('load', () => {
      // Wait for fonts to load (can affect height)
      if (document.fonts?.ready) {
        document.fonts.ready.then(() => {
          setTimeout(sendSizeToMain, 50);
        });
      } else {
        setTimeout(sendSizeToMain, 100);
      }
    });

    // Watch for DOM changes (sections becoming visible/hidden)
    const resizeObserver = new ResizeObserver(() => {
      sendSizeThrottled();
    });
    resizeObserver.observe(containerEl);

    // Also send size when status changes (sections appear/disappear)
    ipcRenderer.on('update-status', () => {
      // Give DOM time to update visibility classes
      setTimeout(sendSizeToMain, 100);
      setTimeout(sendSizeToMain, 300); // Second check for animations
    });

    // Click-Through nicht nötig - Auto-Resize macht das Window exakt so groß wie die Card
  </script>
</body>
</html>
